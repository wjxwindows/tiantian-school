name: Build APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build 孩子端 APK
        run: ./gradlew :app:assembleChildDebug --no-daemon --stacktrace

      - name: Build 家长端 APK
        run: ./gradlew :app:assembleParentDebug --no-daemon --stacktrace

      - name: Upload 孩子端 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 天天校园-孩子端-APK
          path: app/build/outputs/apk/child/debug/*.apk
          if-no-files-found: error

      - name: Upload 家长端 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 天天校园-家长端-APK
          path: app/build/outputs/apk/parent/debug/*.apk
          if-no-files-found: error
