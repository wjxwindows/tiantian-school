# 内存吃紧的机器：限核 + 压低堆，Metaspace 给足（编译期类元数据多）
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2 -XX:ParallelGCThreads=2 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
# Kotlin 用独立进程编译：避免编译期堆外内存把 Gradle 进程撑爆
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2 -XX:ParallelGCThreads=2
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
